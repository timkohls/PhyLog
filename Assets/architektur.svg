<svg viewBox="0 0 900 530" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="esp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="530" rx="20" fill="url(#bg)"/>

  <!-- Software -->
  <rect x="150" y="30" width="600" height="100" rx="16" fill="url(#soft)"/>
  <text x="450" y="72" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" letter-spacing="3">SOFTWARE</text>
  <text x="450" y="102" text-anchor="middle" font-size="15" fill="#e0f2fe">Live-Diagramm · Trigger · Fits · CSV/PNG</text>

  <!-- Verbindung 1 -->
  <line x1="450" y1="136" x2="450" y2="184" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="5 4" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="468" y="165" font-size="14" fill="#cbd5e1">USB oder Bluetooth</text>

  <!-- ESP32 -->
  <rect x="150" y="190" width="600" height="100" rx="16" fill="url(#esp)"/>
  <text x="450" y="232" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">ESP32 (Firmware)</text>
  <text x="450" y="262" text-anchor="middle" font-size="15" fill="#ecfdf5">USB-C · zwei Sensor-Slots · Streaming</text>

  <!-- Verbindung 2 -->
  <line x1="450" y1="296" x2="450" y2="344" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="5 4" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="468" y="325" font-size="14" fill="#cbd5e1">Steckverbinder</text>

  <!-- Sensormodule -->
  <rect x="30" y="350" width="840" height="150" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="382" text-anchor="middle" font-size="17" font-weight="700" fill="#fbbf24" letter-spacing="1">SENSORMODULE (STECKBAR)</text>

  <g font-size="13" text-anchor="middle">
    <!-- Kachel 1 -->
    <rect x="50" y="398" width="98" height="84" rx="12" fill="#334155"/>
    <circle cx="99" cy="429" r="15" fill="#f59e0b"/>
    <text x="99" y="434" font-size="14" font-weight="700" fill="#0f172a">V</text>
    <text x="99" y="466" fill="#e2e8f0">Spannung</text>

    <rect x="167" y="398" width="98" height="84" rx="12" fill="#334155"/>
    <circle cx="216" cy="429" r="15" fill="#f59e0b"/>
    <text x="216" y="434" font-size="14" font-weight="700" fill="#0f172a">A</text>
    <text x="216" y="466" fill="#e2e8f0">Strom</text>

    <rect x="284" y="398" width="98" height="84" rx="12" fill="#334155"/>
    <circle cx="333" cy="429" r="15" fill="#f59e0b"/>
    <text x="333" y="434" font-size="13" font-weight="700" fill="#0f172a">°C</text>
    <text x="333" y="466" fill="#e2e8f0">Temperatur</text>

    <rect x="401" y="398" width="98" height="84" rx="12" fill="#334155"/>
    <circle cx="450" cy="429" r="15" fill="#f59e0b"/>
    <text x="450" y="434" font-size="13" font-weight="700" fill="#0f172a">lx</text>
    <text x="450" y="466" fill="#e2e8f0">Licht</text>

    <rect x="518" y="398" width="98" height="84" rx="12" fill="#334155"/>
    <circle cx="567" cy="429" r="15" fill="#f59e0b"/>
    <text x="567" y="434" font-size="14" font-weight="700" fill="#0f172a">N</text>
    <text x="567" y="466" fill="#e2e8f0">Kraft</text>

    <rect x="635" y="398" width="98" height="84" rx="12" fill="#334155"/>
    <circle cx="684" cy="429" r="15" fill="#f59e0b"/>
    <text x="684" y="434" font-size="13" font-weight="700" fill="#0f172a">dB</text>
    <text x="684" y="466" fill="#e2e8f0">Mikrofon</text>

    <rect x="752" y="398" width="98" height="84" rx="12" fill="#334155"/>
    <circle cx="801" cy="429" r="15" fill="#f59e0b"/>
    <text x="801" y="434" font-size="13" font-weight="700" fill="#0f172a">Hz</text>
    <text x="801" y="466" fill="#e2e8f0">Hall</text>
  </g>
</svg>
